name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - webapi
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name SDU_DeepSeek_API --console main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDU_DeepSeek_API
        path: dist/SDU_DeepSeek_API.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: SDU_DeepSeek_API
    
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT
        else
          echo "VERSION=nightly-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "TAG_NAME=nightly" >> $GITHUB_OUTPUT
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Delete old nightly release
      if: contains(steps.version.outputs.TAG_NAME, 'nightly')
      run: |
        gh release delete nightly --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.TAG_NAME }}
        name: SDU DeepSeek API ${{ steps.version.outputs.VERSION }}
        body: |
          ## SDU DeepSeek API
          
          OpenAI 兼容的山东大学 DeepSeek API 服务。
          
          ### 使用方法
          1. 下载 `SDU_DeepSeek_API.exe`
          2. 运行程序，首次使用需要输入学号和密码登录
          3. 程序将在 `http://localhost:8000` 启动服务
          
          ### 支持的模型
          - deepseek-ai/DeepSeek-V3.2
          - deepseek-ai/DeepSeek-R1
          - deepseek-ai/DeepSeek-V3
          - deepseek-ai/DeepSeek-V3.2-think
          - Qwen/Qwen3-235B-A22B-Instruct
          - Qwen/Qwen3-235B-A22B-Thinking
        files: SDU_DeepSeek_API.exe
        prerelease: ${{ steps.version.outputs.PRERELEASE }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
